# Publishes the PLAYGROUND - the real console projects compiled to WebAssembly, running in the browser:
#   https://justadevfrom92.github.io/csharp/
# GitHub Pages only serves static files, and a Blazor WebAssembly app is just static files (HTML, JS, .wasm, .dll).
name: Pages

on:
  push:
    branches: [main]
    paths: ["Projects/**", ".github/workflows/pages.yml"]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# The deploy step needs to write to Pages and prove who it is (OIDC token).
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment halfway; a newer one simply waits.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Projects/global.json

      - name: Publish the playground
        run: dotnet publish Projects/Playground/Playground/Playground.csproj -c Release -o publish

      # The site lives at /csharp/, not at the root, so the app must load its files from there.
      # 404.html = a copy of index.html: opening /csharp/run/9.7 directly gives GitHub's 404 page,
      # which is then the app itself, and the app shows the right project.
      # .nojekyll stops GitHub from hiding the "_framework" folder (Jekyll skips names starting with "_").
      - name: Prepare for GitHub Pages
        working-directory: publish/wwwroot
        run: |
          sed -i 's#<base href="/" />#<base href="/csharp/" />#' index.html
          rm -f index.html.br index.html.gz
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
